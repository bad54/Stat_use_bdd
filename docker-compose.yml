services:
  postgres:
    image: postgres:16-alpine
    container_name: icn_dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: icn_user
      POSTGRES_PASSWORD: icn_password
      POSTGRES_DB: icn_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icn_user -d icn_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
